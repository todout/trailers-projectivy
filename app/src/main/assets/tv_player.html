<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tráileres Fondos Projectivy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        
        /* YouTube Container Positioned to Hide Top Video Title */
        #player-container {
            position: absolute;
            top: -65px;
            left: 0;
            width: 100%;
            height: calc(100% + 130px);
            z-index: 1;
            background: #000;
        }
        iframe#yt-player {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }
        
        /* Top Mask to guarantee zero YouTube UI overlay */
        .top-yt-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120px;
            z-index: 8;
            background: linear-gradient(180deg, #000000 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        /* Hero Left Side Vignette Overlay (Ampliado de Izquierda a Derecha) */
        .hero-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: linear-gradient(90deg, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.85) 45%, rgba(0,0,0,0.4) 75%, rgba(0,0,0,0) 100%),
                        linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.95) 100%);
            pointer-events: none;
        }

        /* Left OSD Sinopsis Hero Panel (Posicionado más arriba para no chocar con las tarjetas) */
        .osd-left-panel {
            position: absolute;
            top: 40px;
            left: 50px;
            width: 650px;
            max-height: 260px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
            transform: translateX(0);
            opacity: 1;
            pointer-events: none;
        }
        .osd-left-panel.fullscreen-active {
            transform: translateX(-120%);
            opacity: 0;
        }

        .movie-subtitle {
            font-size: 16px;
            color: #e50914;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.95);
        }
        .movie-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.08;
            text-shadow: 0 4px 16px rgba(0,0,0,0.98);
            color: #ffffff;
        }
        .movie-overview {
            font-size: 15px;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.92);
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0,0,0,0.95);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 2px;
        }

        /* Netflix Multi-Row Bottom Container */
        .netflix-rows-panel {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 380px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: hidden;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
            transform: translateY(0);
            opacity: 1;
        }
        .netflix-rows-panel.fullscreen-active {
            transform: translateY(120%);
            opacity: 0;
            pointer-events: none;
        }

        .rows-wrapper {
            display: flex;
            flex-direction: column;
            gap: 22px;
            transition: transform 0.35s ease;
            padding: 0 50px;
        }

        .netflix-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .row-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .row-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        .row-cards {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            padding: 6px 0;
        }
        .row-cards::-webkit-scrollbar {
            display: none;
        }

        /* Netflix Style Vertical Card (Posters 2:3 ratio) */
        .netflix-card {
            flex: 0 0 120px;
            height: 180px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: #141414;
            border: 2px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0,0,0,0.8);
        }
        .netflix-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .netflix-card.active {
            border-color: #e50914;
            transform: scale(1.12);
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.85);
            z-index: 5;
        }
        .netflix-card.active img {
            opacity: 1;
            transform: scale(1.04);
        }
        .card-label {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.95) 100%);
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Seek indicator */
        .seek-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 25;
            background: rgba(0,0,0,0.88);
            border: 2px solid #e50914;
            padding: 20px 40px;
            border-radius: 16px;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.5);
        }
        .seek-toast.show {
            opacity: 1;
        }

        /* Loading Screen */
        .loader-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 35;
            background: #080808;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div class="loader-text" id="loader-status">Cargando experiencia Netflix...</div>
    </div>

    <!-- YouTube Top UI Mask -->
    <div class="top-yt-mask"></div>

    <!-- Hero Vignette Background Overlay (Ampliada a la izquierda) -->
    <div class="hero-vignette"></div>

    <!-- YouTube Player Container -->
    <div id="player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Left OSD Sinopsis Panel -->
    <div id="osd-left" class="osd-left-panel">
        <div id="movie-subtitle" class="movie-subtitle">PELÍCULA • 2024</div>
        <div id="movie-title" class="movie-title">CARGANDO...</div>
        <div id="movie-overview" class="movie-overview">Cargando sinopsis en español latino...</div>
    </div>

    <!-- Netflix Multi-Row Bottom Container -->
    <div id="netflix-rows" class="netflix-rows-panel">
        <div id="rows-wrapper" class="rows-wrapper">
            <!-- Filas dinámicas -->
        </div>
    </div>

    <!-- Seek Toast Indicator -->
    <div id="seek-toast" class="seek-toast">
        <span id="seek-text">+10s</span>
    </div>

    <script>
        let categories = [];
        let currentRowIndex = 0;
        let currentCardIndex = 0;
        let player = null;
        let isPlayerReady = false;
        let autoFullscreenTimer = null;
        let isFullscreenActive = false;
        let currentVideoId = null;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            fetchSubredditWallpapers();
        }

        async function fetchSubredditWallpapers() {
            document.getElementById('loader-status').innerText = "Cargando catálogo Netflix...";
            categories = [];

            // 1. Cargar las 5 filas desde GitHub Raw (con timestamp anti-caché)
            try {
                const cacheUrl = `https://raw.githubusercontent.com/todout/fondos-projectivy/master/trailers_cache.json?t=${Date.now()}`;
                const remoteRes = await fetch(cacheUrl);
                if (remoteRes.ok) {
                    const data = await remoteRes.json();
                    if (data && data.rows) {
                        categories = data.rows;
                    } else if (Array.isArray(data)) {
                        categories = [{ category: "Recomendaciones para vos", items: data }];
                    }
                }
            } catch (e) {
                console.warn("Error cargando desde GitHub Raw:", e);
            }

            // 2. Respaldo local si no hay conexión
            if (categories.length === 0) {
                try {
                    const localRes = await fetch('./trailers.json');
                    if (localRes.ok) {
                        const localData = await localRes.json();
                        if (localData && localData.rows) {
                            categories = localData.rows;
                        } else if (Array.isArray(localData)) {
                            categories = [{ category: "Recomendaciones para vos", items: localData }];
                        }
                    }
                } catch (e) {}
            }

            if (categories.length === 0) {
                document.getElementById('loader-status').innerText = "No se pudo cargar el catálogo.";
                return;
            }

            renderNetflixRows();

            if (!player) {
                initPlayer();
            } else {
                updateSelection(0, 0, true);
            }
        }

        function renderNetflixRows() {
            const wrapper = document.getElementById('rows-wrapper');
            wrapper.innerHTML = '';

            categories.forEach((cat, rIdx) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'netflix-row';
                rowDiv.id = `row-${rIdx}`;

                const cardsHtml = cat.items.map((item, cIdx) => {
                    const posterSrc = item.poster_url || item.backdrop_url || '';
                    const bgImg = posterSrc ? `<img src="${posterSrc}" alt="${item.title}" onerror="this.style.display='none'">` : '';
                    return `
                        <div class="netflix-card ${rIdx === 0 && cIdx === 0 ? 'active' : ''}" id="card-${rIdx}-${cIdx}" onclick="onCardClicked(${rIdx}, ${cIdx})">
                            ${bgImg}
                            <div class="card-label">${item.title}</div>
                        </div>
                    `;
                }).join('');

                rowDiv.innerHTML = `
                    <div class="row-header">
                        <div class="row-title">${cat.category}</div>
                    </div>
                    <div class="row-cards" id="cards-track-${rIdx}">
                        ${cardsHtml}
                    </div>
                `;

                wrapper.appendChild(rowDiv);
            });
        }

        function updateSelection(rIdx, cIdx, forcePlay = false) {
            if (rIdx < 0) rIdx = categories.length - 1;
            if (rIdx >= categories.length) rIdx = 0;

            const targetRow = categories[rIdx];
            if (!targetRow || !targetRow.items || targetRow.items.length === 0) return;

            if (cIdx < 0) cIdx = targetRow.items.length - 1;
            if (cIdx >= targetRow.items.length) cIdx = 0;

            // Desmarcar anterior
            const prevCard = document.getElementById(`card-${currentRowIndex}-${currentCardIndex}`);
            if (prevCard) prevCard.classList.remove('active');

            currentRowIndex = rIdx;
            currentCardIndex = cIdx;

            const item = targetRow.items[currentCardIndex];
            const activeCard = document.getElementById(`card-${currentRowIndex}-${currentCardIndex}`);
            if (activeCard) {
                activeCard.classList.add('active');
                activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            // Desplazar contenedor de filas verticalmente
            const wrapper = document.getElementById('rows-wrapper');
            wrapper.style.transform = `translateY(-${currentRowIndex * 210}px)`;

            // Actualizar sinopsis e información en panel izquierdo (sin leyendas de error)
            document.getElementById('movie-title').innerText = item.title;
            document.getElementById('movie-subtitle').innerText = item.subtitle || 'PELÍCULA';
            document.getElementById('movie-overview').innerText = item.overview && item.overview.trim() ? item.overview : '';

            wakeUI();

            // Cargar tráiler si el vídeo cambia
            if (item.youtube_id && item.youtube_id !== currentVideoId) {
                currentVideoId = item.youtube_id;
                if (player && isPlayerReady) {
                    player.loadVideoById(item.youtube_id);
                }
            }

            resetAutoFullscreenTimer();
        }

        function onCardClicked(rIdx, cIdx) {
            updateSelection(rIdx, cIdx, true);
        }

        function wakeUI() {
            isFullscreenActive = false;
            document.getElementById('osd-left').classList.remove('fullscreen-active');
            document.getElementById('netflix-rows').classList.remove('fullscreen-active');
            resetAutoFullscreenTimer();
        }

        function enterFullscreenTrailer() {
            isFullscreenActive = true;
            document.getElementById('osd-left').classList.add('fullscreen-active');
            document.getElementById('netflix-rows').classList.add('fullscreen-active');
        }

        function resetAutoFullscreenTimer() {
            clearTimeout(autoFullscreenTimer);
            autoFullscreenTimer = setTimeout(() => {
                enterFullscreenTrailer();
            }, 3500);
        }

        function initPlayer() {
            document.getElementById('loader').style.display = 'none';
            const firstItem = categories[0]?.items[0] || { youtube_id: '0I7Q1WtTf_c' };
            currentVideoId = firstItem.youtube_id || '0I7Q1WtTf_c';
            const appOrigin = window.location.origin && window.location.origin !== 'null' && window.location.origin !== 'file://' ? window.location.origin : 'https://www.youtube-nocookie.com';

            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: currentVideoId,
                host: 'https://www.youtube-nocookie.com',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'iv_load_policy': 3,
                    'enablejsapi': 1,
                    'playsinline': 1,
                    'origin': appOrigin,
                    'widget_referrer': appOrigin
                },
                events: {
                    'onReady': () => {
                        isPlayerReady = true;
                        updateSelection(0, 0, true);
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.ENDED) {
                            updateSelection(currentRowIndex, currentCardIndex + 1, true);
                        }
                    },
                    'onError': (e) => {
                        console.warn("YT Error:", e.data);
                        const item = categories[currentRowIndex]?.items[currentCardIndex];
                        if (item && isPlayerReady) {
                            player.loadPlaylist({
                                list: item.title + ' trailer oficial espanol latino',
                                listType: 'search'
                            });
                        }
                    }
                }
            });
        }

        function seekBy(seconds) {
            if (!player || !isPlayerReady) return;
            const curr = player.getCurrentTime();
            player.seekTo(curr + seconds, true);
            showSeekToast(seconds > 0 ? `+${seconds}s` : `${seconds}s`);
            wakeUI();
        }

        function togglePlayPause() {
            if (!player || !isPlayerReady) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                showSeekToast("PAUSA");
            } else {
                player.playVideo();
                showSeekToast("PLAY");
            }
            wakeUI();
        }

        function showSeekToast(text) {
            const toast = document.getElementById('seek-toast');
            document.getElementById('seek-text').innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1200);
        }

        // Control Remoto D-Pad
        document.addEventListener('keydown', (e) => {
            if (isFullscreenActive) {
                wakeUI();
                return;
            }

            switch(e.keyCode) {
                case 38: // Arriba
                case 19:
                    updateSelection(currentRowIndex - 1, currentCardIndex);
                    break;
                case 40: // Abajo
                case 20:
                    updateSelection(currentRowIndex + 1, currentCardIndex);
                    break;
                case 37: // Izquierda
                case 21:
                    updateSelection(currentRowIndex, currentCardIndex - 1);
                    break;
                case 39: // Derecha
                case 22:
                    updateSelection(currentRowIndex, currentCardIndex + 1);
                    break;
                case 13: // Enter / OK
                case 23:
                case 32:
                case 85:
                    togglePlayPause();
                    break;
                case 27: // ESC / BACK
                case 4:
                    enterFullscreenTrailer();
                    break;
                default:
                    wakeUI();
                    break;
            }
        });
    </script>
</body>
</html>
