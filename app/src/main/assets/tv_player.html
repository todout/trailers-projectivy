<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tráileres Fondos Projectivy</title>
    <link rel="preconnect" href="https://www.youtube-nocookie.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://www.google.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            color: #fff;
        }
        
        /* YouTube Container Positioned & Cropped to Hide Top Video Title */
        #player-container {
            position: fixed;
            top: -65px;
            left: 0;
            width: 100vw;
            height: calc(100vh + 130px);
            z-index: 1;
            background: #000;
            overflow: hidden;
        }
        iframe#yt-player {
            width: 100vw;
            height: calc(100vh + 130px);
            border: none;
            pointer-events: none;
        }

        /* Fullscreen Hero Image - Ubicada en la esquina superior derecha (Estilo Netflix / Projectivy) */
        #hero-bg-img {
            position: fixed;
            top: 0;
            right: 0;
            left: auto;
            width: 65vw;
            height: 75vh;
            object-fit: cover;
            object-position: center top;
            z-index: 3;
            transition: opacity 0.85s cubic-bezier(0.25, 1, 0.5, 1), transform 0.85s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 1;
            transform: scale(1) translateZ(0);
            will-change: opacity, transform;
        }
        #hero-bg-img.hidden-hero {
            opacity: 0;
            transform: scale(1.04) translateZ(0);
            pointer-events: none;
        }
        
        /* Top Mask to guarantee zero YouTube UI overlay */
        .top-yt-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 90px;
            z-index: 8;
            background: linear-gradient(180deg, #000000 0%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        /* Hero Left Side & Bottom Vignette Overlay */
        .hero-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            background: linear-gradient(90deg, #000000 0%, #000000 38%, rgba(0,0,0,0.85) 55%, rgba(0,0,0,0.2) 75%, rgba(0,0,0,0) 100%),
                        linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85) 60%, #000000 85%);
            transition: opacity 0.85s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 1;
            pointer-events: none;
            will-change: opacity;
            transform: translateZ(0);
        }
        .hero-vignette.fullscreen-active {
            opacity: 0;
        }

        /* Left OSD Sinopsis Panel (Ancho ampliado a 580px para títulos en 1 sola línea) */
        .osd-left-panel {
            position: fixed;
            top: 25px;
            left: 50px;
            width: 580px;
            max-width: 580px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.75s cubic-bezier(0.25, 1, 0.5, 1);
            transform: translateX(0);
            opacity: 1;
            pointer-events: none;
            will-change: transform, opacity;
        }
        .osd-left-panel.fullscreen-active {
            transform: translateX(-120%);
            opacity: 0;
        }

        .movie-subtitle {
            font-size: 14px;
            color: #e50914;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.95);
        }
        .movie-title {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.08;
            text-shadow: 0 4px 16px rgba(0,0,0,0.98);
            color: #ffffff;
        }
        .movie-overview {
            font-size: 15px;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.92);
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0,0,0,0.95);
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 2px;
        }

        /* Trailer Loader Pill inside Synopsis Panel */
        .trailer-loader-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.5px;
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
            width: fit-content;
            margin-top: 6px;
        }
        .trailer-loader-pill.visible {
            opacity: 1;
        }
        .spinner-dot {
            width: 11px;
            height: 11px;
            border: 2px solid rgba(229, 9, 20, 0.3);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spinDot 0.7s linear infinite;
        }
        @keyframes spinDot {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Netflix Multi-Row Bottom Container */
        .netflix-rows-panel {
            position: fixed;
            bottom: 10px;
            left: 0;
            width: 100vw;
            height: 275px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
            transform: translateY(0);
            opacity: 1;
        }
        .netflix-rows-panel.fullscreen-active {
            transform: translateY(120%);
            opacity: 0;
            pointer-events: none;
        }

        .rows-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 8px 50px 0 50px;
            will-change: transform;
            transform: translateZ(0);
            contain: layout style;
        }

        .netflix-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: opacity 0.35s ease;
            will-change: opacity;
            transform: translateZ(0);
        }
        .row-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .row-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            margin-bottom: 2px;
        }
        
        /* Contenedor de Tarjetas */
        .row-cards {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            padding: 12px 10px;
            margin: 0;
            will-change: scroll-position;
            contain: layout style;
        }
        .row-cards::-webkit-scrollbar {
            display: none;
        }

        /* Netflix Style Vertical Card (Póster uniforme 95px x 140px) */
        .netflix-card {
            flex: 0 0 95px;
            height: 140px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #222222 0%, #111111 100%);
            border: 2.5px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0,0,0,0.8);
            will-change: transform, border-color, box-shadow;
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        .netflix-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: opacity 0.25s ease, transform 0.25s ease;
            will-change: opacity, transform;
            transform: translateZ(0);
        }
        .netflix-card.active {
            border-color: #e50914;
            transform: scale(1.14);
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.95);
            z-index: 10;
        }
        .netflix-card.active img {
            opacity: 1;
            transform: scale(1.04);
        }
        .card-label {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.95) 100%);
            padding: 4px 6px;
            font-size: 10px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Discreet Footer Update Link */
        .footer-update-row {
            display: flex;
            justify-content: flex-start;
            padding: 12px 10px 40px 10px;
            opacity: 0.5;
            transition: opacity 0.25s ease;
        }
        .footer-update-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            transition: all 0.25s ease;
            will-change: transform, border-color;
            transform: translateZ(0);
        }
        .footer-update-btn.active {
            background: rgba(229, 9, 20, 0.9);
            border-color: #e50914;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.8);
            transform: scale(1.08);
        }

        /* Top-Left Mini Badge Panel (Solo póster y texto sin tarjeta de fondo) */
        .mini-badge-panel {
            position: fixed;
            top: 30px;
            left: 45px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 14px;
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
            transform: translateY(-160%);
            opacity: 0;
            pointer-events: none;
        }
        .mini-badge-panel.visible-badge {
            transform: translateY(0);
            opacity: 1;
        }
        .mini-poster-img {
            width: 44px;
            height: 64px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.95);
            background: #141414;
        }
        .mini-info-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .mini-title-text {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.98), 0 0 12px rgba(0,0,0,0.9);
            max-width: 450px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.15;
        }
        .mini-subtitle-text {
            font-size: 12px;
            font-weight: 800;
            color: #e50914;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0,0,0,0.98);
            line-height: 1.15;
        }

        /* Loading Screen */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 35;
            background: #080808;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div class="loader-text" id="loader-status">Cargando recomendaciones para vos...</div>
    </div>

    <!-- YouTube Top UI Mask -->
    <div class="top-yt-mask"></div>

    <!-- Hero Left Side Vignette Overlay -->
    <div id="hero-vignette" class="hero-vignette"></div>

    <!-- Fullscreen Hero Image -->
    <img id="hero-bg-img" class="" src="" alt="Hero Image">

    <!-- YouTube Player Container -->
    <div id="player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Left OSD Sinopsis Panel -->
    <div id="osd-left" class="osd-left-panel">
        <div id="movie-subtitle" class="movie-subtitle">...</div>
        <div id="movie-title" class="movie-title">...</div>
        <div id="movie-overview" class="movie-overview">...</div>
        <div id="trailer-loader-pill" class="trailer-loader-pill">
            <div class="spinner-dot"></div>
            <span>Cargando tráiler HD...</span>
        </div>
    </div>

    <!-- Top-Left Mini Badge Panel (Aparece al reproducir limpio en pantalla completa) -->
    <div id="mini-badge" class="mini-badge-panel">
        <img id="mini-poster" class="mini-poster-img" src="" alt="Mini Poster">
        <div class="mini-info-wrapper">
            <div id="mini-title" class="mini-title-text">...</div>
            <div id="mini-subtitle-1" class="mini-subtitle-text">...</div>
            <div id="mini-subtitle-2" class="mini-subtitle-text">...</div>
        </div>
    </div>

    <!-- Netflix Multi-Row Bottom Container -->
    <div id="netflix-rows" class="netflix-rows-panel">
        <div id="rows-wrapper" class="rows-wrapper">
            <!-- Filas dinámicas -->
        </div>
    </div>

    <script>
        let categories = [];
        let currentRowIndex = 0;
        let currentCardIndex = 0;
        let player = null;
        let isPlayerReady = false;
        let preloadTimer = null;
        let hideRowsTimer = null;
        let hideSinopsisTimer = null;
        let isFullscreenActive = false;
        let isPausedManually = false;
        let isVideoLoadedAndPlaying = false;
        let currentVideoId = null;

        const preloadedBackdrops = {};
        const preloadedPosters = {};

        const tag = document.createElement('script');
        tag.src = "https://www.youtube/iframe_api".startsWith("http") ? "https://www.youtube.com/iframe_api" : "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            fetchSubredditWallpapers();
        }

        function setLoaderStatusText(text) {
            const el = document.getElementById('loader-status');
            if (el) el.innerText = text;
        }

        function preloadRowFirstItems() {
            // Precarga eficiente de las 2 primeras filas sin saturar la red
            categories.slice(0, 3).forEach((cat, rIdx) => {
                if (cat && cat.items) {
                    cat.items.slice(0, 2).forEach((item, cIdx) => {
                        const key = `${rIdx}-${cIdx}`;
                        if (item.backdrop_url && !preloadedBackdrops[key]) {
                            const bg = new Image();
                            bg.src = item.backdrop_url;
                            preloadedBackdrops[key] = bg;
                        }
                    });
                }
            });
        }

        async function fetchSubredditWallpapers() {
            setLoaderStatusText("Cargando recomendaciones para vos...");
            categories = [];

            // 1. Carga ultra-rápida inmediata desde los assets locales (0ms de latencia)
            try {
                const localRes = await fetch('./trailers.json');
                if (localRes.ok) {
                    const localData = await localRes.json();
                    if (localData && localData.rows) {
                        categories = localData.rows;
                    } else if (Array.isArray(localData)) {
                        categories = [{ category: "Recomendaciones para vos", items: localData }];
                    }
                }
            } catch (e) {
                console.warn("No se pudo cargar trailers.json local:", e);
            }

            // Si se cargó localmente, renderizar e iniciar la app de inmediato
            if (categories.length > 0) {
                preloadRowFirstItems();
                renderNetflixRows();
                if (!player) {
                    initPlayer();
                } else {
                    updateSelection(0, 0, true);
                    dismissLoader();
                }
            }

            // 2. Sincronizar en segundo plano desde GitHub Raw para obtener novedades sin bloquear
            try {
                const cacheUrl = `https://raw.githubusercontent.com/todout/trailers-projectivy/main/app/src/main/assets/trailers.json?t=${Date.now()}`;
                const remoteRes = await fetch(cacheUrl);
                if (remoteRes.ok) {
                    const data = await remoteRes.json();
                    const remoteRows = data && data.rows ? data.rows : (Array.isArray(data) ? [{ category: "Recomendaciones para vos", items: data }] : []);
                    if (remoteRows.length > 0 && categories.length === 0) {
                        categories = remoteRows;
                        preloadRowFirstItems();
                        renderNetflixRows();
                        if (!player) initPlayer();
                        else { updateSelection(0, 0, true); dismissLoader(); }
                    }
                }
            } catch (e) {
                console.warn("Error sincronizando catálogo remoto en segundo plano:", e);
            }

            if (categories.length === 0) {
                setLoaderStatusText("No se pudo cargar el catálogo.");
                return;
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 400);
            }
        }

        function renderNetflixRows() {
            const wrapper = document.getElementById('rows-wrapper');
            wrapper.innerHTML = '';

            categories.forEach((cat, rIdx) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'netflix-row';
                rowDiv.id = `row-${rIdx}`;

                const cardsHtml = cat.items.map((item, cIdx) => {
                    const posterSrc = item.poster_url || item.backdrop_url || '';
                    const priorityAttr = (rIdx === 0 && cIdx < 6) ? 'fetchpriority="high"' : '';
                    // Eliminamos 'loading=lazy' que causaba carátulas en blanco en scroll horizontal
                    const bgImg = posterSrc ? `<img src="${posterSrc}" alt="${item.title}" loading="eager" decoding="async" ${priorityAttr} onerror="this.style.display='none'">` : '';
                    return `
                        <div class="netflix-card ${rIdx === 0 && cIdx === 0 ? 'active' : ''}" id="card-${rIdx}-${cIdx}" onclick="onCardClicked(${rIdx}, ${cIdx})">
                            ${bgImg}
                            <div class="card-label">${item.title}</div>
                        </div>
                    `;
                }).join('');

                rowDiv.innerHTML = `
                    <div class="row-header">
                        <div class="row-title">${cat.category}</div>
                    </div>
                    <div class="row-cards" id="cards-track-${rIdx}">
                        ${cardsHtml}
                    </div>
                `;

                wrapper.appendChild(rowDiv);
            });

            const footerDiv = document.createElement('div');
            footerDiv.className = 'footer-update-row';
            footerDiv.id = `row-${categories.length}`;
            footerDiv.innerHTML = `
                <div class="footer-update-btn" id="card-${categories.length}-0" onclick="checkAppUpdates(true)">
                    <span>⚙️</span>
                    <span>Comprobar actualizaciones de la app</span>
                </div>
            `;
            wrapper.appendChild(footerDiv);
        }

        function getMiniBadgeSubtitles(subtitle) {
            if (!subtitle) return { line1: '', line2: '' };
            if (subtitle.includes('\n')) {
                const lines = subtitle.split('\n');
                return { line1: lines[0].trim(), line2: lines[1] ? lines[1].trim() : '' };
            }

            const parts = subtitle.split('•').map(p => p.trim()).filter(p => p.length > 0);
            if (parts.length === 0) return { line1: '', line2: '' };
            if (parts.length === 1) return { line1: parts[0], line2: '' };

            function formatToken(token) {
                return token
                    .replace(/\bTEMPORADAS\b/gi, 'TEMP')
                    .replace(/\bTEMPORADA\b/gi, 'TEMP')
                    .replace(/\bCAP\.\b/gi, 'CAPITULOS')
                    .replace(/\bCAPS\.\b/gi, 'CAPITULOS')
                    .replace(/\bCAP\b/gi, 'CAPITULOS');
            }

            if (parts.length >= 5) {
                const l1 = `${parts[0]} • ${parts[1]} • ${formatToken(parts[2])}`;
                const l2 = `${formatToken(parts[3])} • ${parts[4]}`;
                return { line1: l1, line2: l2 };
            }

            if (parts.length === 4) {
                const isSerie = parts[0].toUpperCase().includes('SERIE');
                if (isSerie) {
                    const l1 = `${parts[0]} • ${parts[1]} • ${formatToken(parts[2])}`;
                    const l2 = formatToken(parts[3]);
                    return { line1: l1, line2: l2 };
                } else {
                    const l1 = `${parts[0]} • ${parts[1]}`;
                    const l2 = `${parts[2]} • ${parts[3]}`;
                    return { line1: l1, line2: l2 };
                }
            }

            if (parts.length === 3) {
                const l1 = `${parts[0]} • ${parts[1]}`;
                const l2 = formatToken(parts[2]);
                return { line1: l1, line2: l2 };
            }

            if (parts.length === 2) {
                return { line1: parts[0], line2: parts[1] };
            }

            return { line1: subtitle, line2: '' };
        }

        function checkAppUpdates(isManual = true) {
            if (window.Android && window.Android.checkAppUpdate) {
                window.Android.checkAppUpdate(isManual);
            }
        }

        function updateSelection(rIdx, cIdx, forcePlay = false) {
            if (rIdx < 0) rIdx = 0;
            if (rIdx > categories.length) rIdx = categories.length;

            const prevCard = document.getElementById(`card-${currentRowIndex}-${currentCardIndex}`);
            if (prevCard) prevCard.classList.remove('active');

            currentRowIndex = rIdx;

            if (currentRowIndex === categories.length) {
                currentCardIndex = 0;
                const activeCard = document.getElementById(`card-${categories.length}-0`);
                if (activeCard) activeCard.classList.add('active');

                const wrapper = document.getElementById('rows-wrapper');
                const targetRowDiv = document.getElementById(`row-${currentRowIndex}`);
                if (targetRowDiv && wrapper) {
                    const targetY = Math.max(0, targetRowDiv.offsetTop - 30);
                    wrapper.style.transform = `translateY(-${targetY}px)`;
                }

                categories.forEach((_, idx) => {
                    const rowDiv = document.getElementById(`row-${idx}`);
                    if (rowDiv) {
                        rowDiv.style.opacity = '0.15';
                        rowDiv.style.pointerEvents = 'none';
                    }
                });

                document.getElementById('movie-title').innerText = "ACTUALIZAR APLICACIÓN";
                document.getElementById('movie-subtitle').innerText = "SISTEMA • COMPROBAR NUEVAS VERSIONES";
                document.getElementById('movie-overview').innerText = "Presiona OK en el control remoto para comprobar de forma segura si hay alguna actualización disponible para esta aplicación.";
                document.getElementById('mini-badge').classList.remove('visible-badge');
                clearTimeout(preloadTimer);
                return;
            }

            const targetRow = categories[rIdx];
            if (!targetRow || !targetRow.items || targetRow.items.length === 0) return;

            if (cIdx < 0) cIdx = 0;
            if (cIdx >= targetRow.items.length) cIdx = targetRow.items.length - 1;

            currentCardIndex = cIdx;

            const item = targetRow.items[currentCardIndex];
            const cardsTrack = document.getElementById(`cards-track-${rIdx}`);
            const activeCard = document.getElementById(`card-${currentRowIndex}-${currentCardIndex}`);
            if (activeCard) {
                activeCard.classList.add('active');
                if (cardsTrack) {
                    const cardLeft = activeCard.offsetLeft;
                    const cardWidth = activeCard.offsetWidth;
                    const trackWidth = cardsTrack.offsetWidth;
                    const targetScroll = cardLeft - (trackWidth / 2) + (cardWidth / 2);
                    cardsTrack.scrollTo({ left: Math.max(0, targetScroll), behavior: 'smooth' });
                }
            }

            // Cálculo exacto de desplazamiento vertical para ubicar CADA fila activa en la MISMA posición exacta
            const wrapper = document.getElementById('rows-wrapper');
            const targetRowDiv = document.getElementById(`row-${currentRowIndex}`);
            if (targetRowDiv && wrapper) {
                const targetY = Math.max(0, targetRowDiv.offsetTop - 8);
                wrapper.style.transform = `translateY(-${targetY}px)`;
            }

            // Control de opacidad para que las filas superiores desaparezcan limpiamente
            categories.forEach((_, idx) => {
                const rowDiv = document.getElementById(`row-${idx}`);
                if (!rowDiv) return;
                if (idx < currentRowIndex) {
                    rowDiv.style.opacity = '0';
                    rowDiv.style.pointerEvents = 'none';
                } else if (idx === currentRowIndex) {
                    rowDiv.style.opacity = '1';
                    rowDiv.style.pointerEvents = 'auto';
                } else if (idx === currentRowIndex + 1) {
                    rowDiv.style.opacity = '0.85';
                    rowDiv.style.pointerEvents = 'auto';
                } else {
                    rowDiv.style.opacity = '0';
                    rowDiv.style.pointerEvents = 'none';
                }
            });

            // Actualizar OSD Sinopsis inmediatamente desde memoria (sin lag)
            document.getElementById('movie-title').innerText = item.title;
            document.getElementById('movie-subtitle').innerText = item.subtitle || 'PELÍCULA';
            document.getElementById('movie-overview').innerText = item.overview && item.overview.trim() ? item.overview : '';

            // Actualizar Mini Badge (Póster, Título y 2 Líneas de Subtítulo)
            document.getElementById('mini-title').innerText = item.title;
            const miniSubs = getMiniBadgeSubtitles(item.subtitle || 'PELÍCULA');
            const elSub1 = document.getElementById('mini-subtitle-1');
            const elSub2 = document.getElementById('mini-subtitle-2');
            if (elSub1) elSub1.innerText = miniSubs.line1;
            if (elSub2) {
                if (miniSubs.line2) {
                    elSub2.innerText = miniSubs.line2;
                    elSub2.style.display = 'block';
                } else {
                    elSub2.innerText = '';
                    elSub2.style.display = 'none';
                }
            }
            const miniPoster = document.getElementById('mini-poster');
            const posterSrc = item.poster_url || item.backdrop_url || '';
            if (miniPoster && posterSrc) {
                miniPoster.src = posterSrc;
            }
            document.getElementById('mini-badge').classList.remove('visible-badge');

            // Mostrar foto HD inmediatamente durante navegación rápida (gracias a precarga)
            const heroImg = document.getElementById('hero-bg-img');
            const heroSrc = item.backdrop_url || item.poster_url || '';
            if (heroSrc) {
                heroImg.src = heroSrc;
                if (!isPausedManually && !isVideoLoadedAndPlaying) {
                    heroImg.classList.remove('hidden-hero');
                }
            }

            // Precarga anticipada de fondos adyacentes para transición instantánea al navegar
            if (targetRow.items[cIdx + 1] && targetRow.items[cIdx + 1].backdrop_url) {
                const nextKey = `${rIdx}-${cIdx + 1}`;
                if (!preloadedBackdrops[nextKey]) {
                    const img = new Image();
                    img.src = targetRow.items[cIdx + 1].backdrop_url;
                    preloadedBackdrops[nextKey] = img;
                }
            }
            if (targetRow.items[cIdx - 1] && targetRow.items[cIdx - 1].backdrop_url) {
                const prevKey = `${rIdx}-${cIdx - 1}`;
                if (!preloadedBackdrops[prevKey]) {
                    const img = new Image();
                    img.src = targetRow.items[cIdx - 1].backdrop_url;
                    preloadedBackdrops[prevKey] = img;
                }
            }

            // Detener por completo el video anterior al cambiar de tarjeta para evitar cualquier despausado o fuga de audio del ítem previo
            if (player && isPlayerReady) {
                try {
                    player.stopVideo();
                } catch(e) {}
            }

            currentVideoId = null;
            isVideoLoadedAndPlaying = false;
            wakeUI();

            // Esperar 8 segundos (8000ms) antes de iniciar el tráiler automáticamente al navegar, o 0ms si el usuario presiona OK
            clearTimeout(preloadTimer);
            const delay = forcePlay ? 0 : 8000;
            preloadTimer = setTimeout(() => {
                startPreloadingVideo(item.youtube_id);
            }, delay);
        }

        let loaderShowTimer = null;

        function showLoaderPill() {
            clearTimeout(loaderShowTimer);
            loaderShowTimer = setTimeout(() => {
                const pill = document.getElementById('trailer-loader-pill');
                if (pill && !isVideoLoadedAndPlaying) {
                    pill.classList.add('visible');
                }
            }, 350);
        }

        function hideLoaderPill() {
            clearTimeout(loaderShowTimer);
            const pill = document.getElementById('trailer-loader-pill');
            if (pill) pill.classList.remove('visible');
        }

        function startPreloadingVideo(videoId) {
            if (player && isPlayerReady && videoId) {
                currentVideoId = videoId;
                showLoaderPill();
                player.loadVideoById({ videoId: videoId, startSeconds: 0 });
            }
        }

        function playNowAndHideUI() {
            if (currentRowIndex === categories.length) {
                checkAppUpdates(true);
                return;
            }
            isPausedManually = false;
            clearTimeout(preloadTimer);
            clearTimeout(hideRowsTimer);
            clearTimeout(hideSinopsisTimer);

            const targetRow = categories[currentRowIndex];
            if (!targetRow || !targetRow.items || targetRow.items.length === 0) return;
            const item = targetRow.items[currentCardIndex];
            if (!item) return;

            if (currentVideoId !== item.youtube_id) {
                startPreloadingVideo(item.youtube_id);
            } else if (player && isPlayerReady) {
                try {
                    const state = player.getPlayerState();
                    if (state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING) {
                        player.playVideo();
                    }
                } catch(e) {
                    startPreloadingVideo(item.youtube_id);
                }
            }

            document.getElementById('netflix-rows').classList.add('fullscreen-active');
            document.getElementById('osd-left').classList.add('fullscreen-active');
            isFullscreenActive = true;

            if (isVideoLoadedAndPlaying) {
                document.getElementById('hero-bg-img').classList.add('hidden-hero');
                document.getElementById('hero-vignette').classList.add('fullscreen-active');
                document.getElementById('mini-badge').classList.add('visible-badge');
            }
        }

        function onCardClicked(rIdx, cIdx) {
            isPausedManually = false;
            if (currentRowIndex !== rIdx || currentCardIndex !== cIdx) {
                updateSelection(rIdx, cIdx);
            }
            playNowAndHideUI();
        }

        function wakeUI(keepPaused = false) {
            isFullscreenActive = false;
            clearTimeout(hideRowsTimer);
            clearTimeout(hideSinopsisTimer);

            // Ocultar mini badge cuando los controles/paneles están despiertos
            document.getElementById('mini-badge').classList.remove('visible-badge');

            if (isPausedManually || isVideoLoadedAndPlaying) {
                document.getElementById('hero-bg-img').classList.add('hidden-hero');
            } else {
                document.getElementById('hero-bg-img').classList.remove('hidden-hero');
            }

            // El degradé (.hero-vignette) SIEMPRE se muestra cuando la interfaz (sinopsis/miniaturas) está despierta para legibilidad del texto
            document.getElementById('hero-vignette').classList.remove('fullscreen-active');
            document.getElementById('osd-left').classList.remove('fullscreen-active');
            document.getElementById('netflix-rows').classList.remove('fullscreen-active');

            if (!keepPaused && !isPausedManually) {
                resetStaggeredFullscreenTimers();
            }
        }

        function resetStaggeredFullscreenTimers() {
            clearTimeout(hideRowsTimer);
            clearTimeout(hideSinopsisTimer);

            if (isPausedManually) return;

            // Ocultar filas a los 8.5 segundos (0.5s después de que arranca el tráiler automático de 8s)
            hideRowsTimer = setTimeout(() => {
                if (!isPausedManually) {
                    document.getElementById('netflix-rows').classList.add('fullscreen-active');
                }
            }, 8500);

            // Ocultar sinopsis a los 10.5 segundos (2.5s después de que arranca el tráiler)
            hideSinopsisTimer = setTimeout(() => {
                if (!isPausedManually) {
                    document.getElementById('osd-left').classList.add('fullscreen-active');
                    isFullscreenActive = true;

                    // Mostrar mini badge en la esquina superior izquierda si el video está reproduciéndose limpio en pantalla completa
                    if (isVideoLoadedAndPlaying) {
                        document.getElementById('hero-bg-img').classList.add('hidden-hero');
                        document.getElementById('hero-vignette').classList.add('fullscreen-active');
                        document.getElementById('mini-badge').classList.add('visible-badge');
                    }
                }
            }, 10500);
        }

        function initPlayer() {
            const firstItem = categories[0]?.items[0] || { youtube_id: '0I7Q1WtTf_c' };
            currentVideoId = firstItem.youtube_id || '0I7Q1WtTf_c';
            const appOrigin = window.location.origin && window.location.origin !== 'null' && window.location.origin !== 'file://' ? window.location.origin : 'https://www.youtube-nocookie.com';

            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: currentVideoId,
                host: 'https://www.youtube-nocookie.com',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'iv_load_policy': 3,
                    'enablejsapi': 1,
                    'playsinline': 1,
                    'origin': appOrigin,
                    'widget_referrer': appOrigin
                },
                events: {
                    'onReady': () => {
                        isPlayerReady = true;
                        updateSelection(0, 0, true);
                        dismissLoader();
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.BUFFERING) {
                            showLoaderPill();
                        } else if (e.data === YT.PlayerState.PLAYING) {
                            isVideoLoadedAndPlaying = true;
                            hideLoaderPill();
                            if (isFullscreenActive) {
                                document.getElementById('hero-bg-img').classList.add('hidden-hero');
                                document.getElementById('hero-vignette').classList.add('fullscreen-active');
                                if (!isPausedManually) {
                                    document.getElementById('mini-badge').classList.add('visible-badge');
                                }
                            }
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            hideLoaderPill();
                            document.getElementById('mini-badge').classList.remove('visible-badge');
                        } else if (e.data === YT.PlayerState.ENDED) {
                            hideLoaderPill();
                            isPausedManually = false;
                            document.getElementById('mini-badge').classList.remove('visible-badge');
                            updateSelection(currentRowIndex, currentCardIndex + 1, true);
                        }
                    },
                    'onError': (e) => {
                        console.warn("YT Error:", e.data);
                        const item = categories[currentRowIndex]?.items[currentCardIndex];
                        if (item && isPlayerReady) {
                            player.loadPlaylist({
                                list: item.title + ' trailer oficial espanol latino',
                                listType: 'search'
                            });
                        }
                    }
                }
            });
        }

        function seekBy(seconds) {
            if (!player || !isPlayerReady) return;
            const curr = player.getCurrentTime();
            player.seekTo(curr + seconds, true);
            wakeUI(isPausedManually);
        }

        function togglePlayPause() {
            if (!player || !isPlayerReady) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                isPausedManually = true;
                clearTimeout(preloadTimer);
                clearTimeout(hideRowsTimer);
                clearTimeout(hideSinopsisTimer);
                player.pauseVideo();
                wakeUI(true);
            } else {
                isPausedManually = false;
                player.playVideo();
                wakeUI(false);
            }
        }

        function handleAndroidBackKey() {
            // Si el tráiler está reproduciéndose en pantalla limpia (o en pausa limpia):
            if (isFullscreenActive) {
                // Hacer lo mismo que la función pausa: pausar video y restaurar portadas, degradé, título, sinopsis
                if (player && isPlayerReady) {
                    player.pauseVideo();
                }
                isPausedManually = true;
                clearTimeout(preloadTimer);
                clearTimeout(hideRowsTimer);
                clearTimeout(hideSinopsisTimer);
                wakeUI(true);
                return true; // Tráiler cerrado, NO cerrar la aplicación
            }
            // Si ya estamos en el menú con las portadas visibles, retornar false para que Android cierre la app
            return false;
        }

        // Control Remoto D-Pad & Teclas Multimedia
        document.addEventListener('keydown', (e) => {
            const isBackKey = (e.keyCode === 27 || e.keyCode === 4);

            if (isBackKey) {
                const handled = handleAndroidBackKey();
                if (handled) {
                    e.preventDefault();
                    return;
                }
            }

            // Si el tráiler está en pantalla completa limpia:
            if (isFullscreenActive) {
                const isOKKey = (e.keyCode === 13 || e.keyCode === 23 || e.keyCode === 32);
                if (isOKKey) {
                    e.preventDefault();
                    // Al presionar OK en pantalla limpia: pausar video y mostrar sinopsis/miniaturas
                    if (player && isPlayerReady) {
                        try { player.pauseVideo(); } catch(e) {}
                    }
                    isPausedManually = true;
                    wakeUI(true);
                    return;
                }
            }

            switch(e.keyCode) {
                case 38: // Arriba - Ir a la 1ra tarjeta de la fila superior
                case 19:
                    e.preventDefault();
                    isPausedManually = false;
                    updateSelection(currentRowIndex - 1, 0);
                    break;
                case 40: // Abajo - Ir a la 1ra tarjeta de la fila inferior
                case 20:
                    e.preventDefault();
                    isPausedManually = false;
                    updateSelection(currentRowIndex + 1, 0);
                    break;
                case 37: // Izquierda - Moverse horizontalmente
                case 21:
                    e.preventDefault();
                    isPausedManually = false;
                    updateSelection(currentRowIndex, currentCardIndex - 1);
                    break;
                case 39: // Derecha - Moverse horizontalmente
                case 22:
                    e.preventDefault();
                    isPausedManually = false;
                    updateSelection(currentRowIndex, currentCardIndex + 1);
                    break;
                case 13: // Enter / OK / Select
                case 23:
                case 32:
                    e.preventDefault();
                    playNowAndHideUI();
                    break;
                case 82: // Botón Menú / Opciones en el control
                case 166: // Botón Info / Canal
                case 170:
                    e.preventDefault();
                    checkAppUpdates(true);
                    break;
                case 85: // Play/Pause Media Button
                case 179:
                    e.preventDefault();
                    togglePlayPause();
                    break;
                case 228: // Fast Forward
                    e.preventDefault();
                    seekBy(10);
                    break;
                case 227: // Rewind
                    e.preventDefault();
                    seekBy(-10);
                    break;
                default:
                    if (!isPausedManually) wakeUI();
                    break;
            }
        });
    </script>
</body>
</html>
