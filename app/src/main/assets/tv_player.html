<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tráileres Fondos Projectivy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }
        iframe#yt-player {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }
        
        /* OSD Overlay */
        .osd-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.9) 100%);
            transition: opacity 0.4s ease-in-out;
            opacity: 1;
            pointer-events: none;
        }
        .osd-overlay.hidden {
            opacity: 0;
        }
        
        .osd-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(229, 9, 20, 0.9);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }
        .counter-badge {
            font-size: 18px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .osd-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .movie-title {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9);
            color: #ffffff;
        }
        .movie-subtitle {
            font-size: 18px;
            color: #e50914;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .controls-hint {
            display: flex;
            gap: 25px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-size: 14px;
            color: rgba(255,255,255,0.75);
        }
        .hint-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .key-btn {
            background: rgba(255,255,255,0.25);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            color: #fff;
            font-size: 13px;
        }

        /* Seek indicator */
        .seek-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: rgba(0,0,0,0.85);
            border: 2px solid #e50914;
            padding: 20px 40px;
            border-radius: 16px;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.5);
        }
        .seek-toast.show {
            opacity: 1;
        }

        /* Loading Spinner */
        .loader-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            background: #080808;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div class="loader-text" id="loader-status">Cargando fondos de Projectivy...</div>
    </div>

    <!-- YouTube Player Container -->
    <div id="player-container">
        <div id="yt-player"></div>
    </div>

    <!-- On Screen Display -->
    <div id="osd" class="osd-overlay">
        <div class="osd-header">
            <div class="app-badge">▶ Projectivy Tráileres</div>
            <div id="counter" class="counter-badge">1 / 1</div>
        </div>
        <div class="osd-footer">
            <div id="movie-subtitle" class="movie-subtitle">🎬 TRÁILER OFICIAL EN ESPAÑOL</div>
            <div id="movie-title" class="movie-title">CARGANDO...</div>
            <div class="controls-hint">
                <div class="hint-item"><span class="key-btn">▲ ▼</span> Cambiar Película</div>
                <div class="hint-item"><span class="key-btn">◄ ►</span> Adelantar / Atrasar 10s</div>
                <div class="hint-item"><span class="key-btn">OK</span> Pausar / Reproducir</div>
            </div>
        </div>
    </div>

    <!-- Seek Toast Indicator -->
    <div id="seek-toast" class="seek-toast">
        <span id="seek-text">+10s</span>
    </div>

    <script>
        // Configuración del Subreddit oficial donde TMDB.py publica los fondos
        const SUBREDDIT_NAME = "IMDB_esp";
        const SUBREDDIT_JSON = `https://www.reddit.com/r/${SUBREDDIT_NAME}/new.json?limit=30`;
        const SUBREDDIT_RSS_API = `https://api.rss2json.com/v1/api.json?rss_url=https://www.reddit.com/r/${SUBREDDIT_NAME}/new.rss`;
        
        let playlist = [];
        let currentIndex = 0;
        let player = null;
        let osdTimeout = null;
        let seekToastTimeout = null;
        let isPlayerReady = false;

        // Cargar YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            fetchSubredditWallpapers();
        }

        async function fetchSubredditWallpapers() {
            document.getElementById('loader-status').innerText = "Cargando tráileres del día...";
            playlist = [];

            // 1. Cargar la lista EN VIVO desde GitHub (con timestamp anti-caché)
            try {
                const cacheUrl = `https://raw.githubusercontent.com/todout/fondos-projectivy/master/trailers_cache.json?t=${Date.now()}`;
                const remoteRes = await fetch(cacheUrl);
                if (remoteRes.ok) {
                    const remoteData = await remoteRes.json();
                    if (remoteData && remoteData.length > 0) {
                        playlist = remoteData.map(item => ({
                            title: item.title,
                            ytId: item.youtube_id || extractYouTubeId(item.trailer_url)
                        }));
                    }
                }
            } catch (remoteErr) {
                console.warn("GitHub Raw cache fetch falló, utilizando respaldo local:", remoteErr);
            }

            // 2. Si falla la red, cargar del JSON local empaquetado en la app
            if (playlist.length === 0) {
                try {
                    const localRes = await fetch('./trailers.json');
                    if (localRes.ok) {
                        const localData = await localRes.json();
                        for (let item of localData) {
                            const ytId = item.youtube_id || extractYouTubeId(item.trailer_url);
                            if (item.title && ytId) {
                                playlist.push({ title: item.title, ytId: ytId });
                            }
                        }
                    }
                } catch (e) {}
            }

            // 3. Si siguiera vacía, usar el RSS de Reddit
            if (playlist.length === 0) {
                try {
                    const rssRes = await fetch(SUBREDDIT_RSS_API);
                    if (rssRes.ok) {
                        const rssData = await rssRes.json();
                        const items = rssData?.items || [];
                        for (let item of items) {
                            playlist.push({
                                title: item.title,
                                ytId: extractYouTubeId(item.content) || extractYouTubeId(item.description)
                            });
                        }
                    }
                } catch (rssErr) {}
            }

            if (playlist.length === 0) {
                document.getElementById('loader-status').innerText = "No se encontraron tráileres.";
                return;
            }

            // Iniciar reproductor inmediatamente sin demoras
            if (!player) {
                initPlayer();
            } else {
                playCurrentIndex();
            }
        }

        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function initPlayer() {
            document.getElementById('loader').style.display = 'none';
            const firstItem = playlist[0] || { ytId: '0I7Q1WtTf_c', title: 'SILO' };
            const appOrigin = window.location.origin && window.location.origin !== 'null' && window.location.origin !== 'file://' ? window.location.origin : 'https://www.youtube-nocookie.com';
            
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: firstItem.ytId || '0I7Q1WtTf_c',
                host: 'https://www.youtube-nocookie.com',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'iv_load_policy': 3,
                    'enablejsapi': 1,
                    'playsinline': 1,
                    'origin': appOrigin,
                    'widget_referrer': appOrigin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            playCurrentIndex();
        }

        function onPlayerStateChange(event) {
            // Cuando termina el tráiler (YT.PlayerState.ENDED = 0), pasa al siguiente
            if (event.data === YT.PlayerState.ENDED) {
                nextTrailer();
            }
        }

        function onPlayerError(event) {
            console.warn("YouTube Player error:", event.data);
            // Si un video particular devuelve Error 150/101/153, buscar el tráiler oficial en YouTube por título
            const item = playlist[currentIndex];
            if (item && isPlayerReady) {
                console.log("Cargando tráiler alternativo por búsqueda para:", item.title);
                player.loadPlaylist({
                    list: item.title + ' trailer oficial espanol',
                    listType: 'search'
                });
            }
        }

        function playCurrentIndex() {
            if (currentIndex < 0) currentIndex = playlist.length - 1;
            if (currentIndex >= playlist.length) currentIndex = 0;

            const item = playlist[currentIndex];
            document.getElementById('movie-title').innerText = item.title;
            document.getElementById('counter').innerText = `${currentIndex + 1} / ${playlist.length}`;

            if (item.ytId && isPlayerReady) {
                player.loadVideoById(item.ytId);
            } else if (isPlayerReady) {
                // Si no se encontró ID en Reddit, busca el tráiler en YouTube
                player.loadPlaylist({
                    list: item.title + ' trailer oficial espanol',
                    listType: 'search'
                });
            }
            showOSD();
        }

        function nextTrailer() {
            currentIndex++;
            playCurrentIndex();
        }

        function prevTrailer() {
            currentIndex--;
            playCurrentIndex();
        }

        function seekBy(seconds) {
            if (!player || !isPlayerReady) return;
            const currTime = player.getCurrentTime();
            player.seekTo(currTime + seconds, true);
            
            showSeekToast(seconds > 0 ? `+${seconds}s` : `${seconds}s`);
            showOSD();
        }

        function togglePlayPause() {
            if (!player || !isPlayerReady) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                showSeekToast("PAUSA");
            } else {
                player.playVideo();
                showSeekToast("PLAY");
            }
            showOSD();
        }

        function showOSD() {
            const osd = document.getElementById('osd');
            osd.classList.remove('hidden');
            clearTimeout(osdTimeout);
            osdTimeout = setTimeout(() => {
                osd.classList.add('hidden');
            }, 3500);
        }

        function showSeekToast(text) {
            const toast = document.getElementById('seek-toast');
            document.getElementById('seek-text').innerText = text;
            toast.classList.add('show');
            clearTimeout(seekToastTimeout);
            seekToastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1200);
        }

        // Eventos del Control Remoto (D-Pad)
        document.addEventListener('keydown', (e) => {
            switch(e.keyCode) {
                case 38: // Arriba
                case 19: // KEYCODE_DPAD_UP
                    prevTrailer();
                    break;
                case 40: // Abajo
                case 20: // KEYCODE_DPAD_DOWN
                    nextTrailer();
                    break;
                case 37: // Izquierda
                case 21: // KEYCODE_DPAD_LEFT
                    seekBy(-10);
                    break;
                case 39: // Derecha
                case 22: // KEYCODE_DPAD_RIGHT
                    seekBy(10);
                    break;
                case 13: // Enter / Select
                case 23: // KEYCODE_DPAD_CENTER
                case 32: // Espacio
                case 85: // KEYCODE_MEDIA_PLAY_PAUSE
                    togglePlayPause();
                    break;
                case 27: // ESC
                case 4:  // KEYCODE_BACK
                    showOSD();
                    break;
                default:
                    showOSD();
                    break;
            }
        });
    </script>
</body>
</html>
