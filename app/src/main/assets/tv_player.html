<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tráileres Fondos Projectivy</title>
    <link rel="preconnect" href="https://www.youtube-nocookie.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://www.google.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            color: #fff;
        }
        
        /* YouTube Container Positioned & Cropped to Hide Top Video Title */
        #player-container {
            position: fixed;
            top: -65px;
            left: 0;
            width: 100vw;
            height: calc(100vh + 130px);
            z-index: 1;
            background: #000;
            overflow: hidden;
        }
        iframe#yt-player {
            width: 100vw;
            height: calc(100vh + 130px);
            border: none;
            pointer-events: none;
        }

        /* Fullscreen Hero Image */
        #hero-bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 3;
            transition: opacity 0.4s ease;
            opacity: 1;
        }
        #hero-bg-img.hidden-hero {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Top Mask to guarantee zero YouTube UI overlay */
        .top-yt-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 90px;
            z-index: 8;
            background: linear-gradient(180deg, #000000 0%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        /* Hero Left Side Vignette Overlay */
        .hero-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            background: linear-gradient(90deg, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.85) 40%, rgba(0,0,0,0.3) 70%, rgba(0,0,0,0) 100%),
                        linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.95) 100%);
            transition: opacity 0.5s ease;
            opacity: 1;
            pointer-events: none;
        }
        .hero-vignette.fullscreen-active {
            opacity: 0;
        }

        /* Left OSD Sinopsis Panel (Ancho ampliado a 580px para títulos en 1 sola línea) */
        .osd-left-panel {
            position: fixed;
            top: 25px;
            left: 50px;
            width: 580px;
            max-width: 580px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
            transform: translateX(0);
            opacity: 1;
            pointer-events: none;
        }
        .osd-left-panel.fullscreen-active {
            transform: translateX(-120%);
            opacity: 0;
        }

        .movie-subtitle {
            font-size: 14px;
            color: #e50914;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.95);
        }
        .movie-title {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.08;
            text-shadow: 0 4px 16px rgba(0,0,0,0.98);
            color: #ffffff;
        }
        .movie-overview {
            font-size: 15px;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.92);
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0,0,0,0.95);
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 2px;
        }

        /* Netflix Multi-Row Bottom Container */
        .netflix-rows-panel {
            position: fixed;
            bottom: 10px;
            left: 0;
            width: 100vw;
            height: 275px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
            transform: translateY(0);
            opacity: 1;
        }
        .netflix-rows-panel.fullscreen-active {
            transform: translateY(120%);
            opacity: 0;
            pointer-events: none;
        }

        .rows-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 8px 50px 0 50px;
            will-change: transform;
        }

        .netflix-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: opacity 0.35s ease;
        }
        .row-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .row-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            margin-bottom: 2px;
        }
        
        /* Contenedor de Tarjetas */
        .row-cards {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            padding: 12px 10px;
            margin: 0;
        }
        .row-cards::-webkit-scrollbar {
            display: none;
        }

        /* Netflix Style Vertical Card (Póster uniforme 95px x 140px) */
        .netflix-card {
            flex: 0 0 95px;
            height: 140px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: #141414;
            border: 2.5px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0,0,0,0.8);
        }
        .netflix-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .netflix-card.active {
            border-color: #e50914;
            transform: scale(1.14);
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.95);
            z-index: 10;
        }
        .netflix-card.active img {
            opacity: 1;
            transform: scale(1.04);
        }
        .card-label {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.95) 100%);
            padding: 4px 6px;
            font-size: 10px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Loading Screen */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 35;
            background: #080808;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div class="loader-text" id="loader-status">Cargando recomendaciones para vos...</div>
    </div>

    <!-- YouTube Top UI Mask -->
    <div class="top-yt-mask"></div>

    <!-- Hero Left Side Vignette Overlay -->
    <div id="hero-vignette" class="hero-vignette"></div>

    <!-- Fullscreen Hero Image -->
    <img id="hero-bg-img" class="" src="" alt="Hero Image">

    <!-- YouTube Player Container -->
    <div id="player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Left OSD Sinopsis Panel -->
    <div id="osd-left" class="osd-left-panel">
        <div id="movie-subtitle" class="movie-subtitle">...</div>
        <div id="movie-title" class="movie-title">...</div>
        <div id="movie-overview" class="movie-overview">...</div>
    </div>

    <!-- Netflix Multi-Row Bottom Container -->
    <div id="netflix-rows" class="netflix-rows-panel">
        <div id="rows-wrapper" class="rows-wrapper">
            <!-- Filas dinámicas -->
        </div>
    </div>

    <script>
        let categories = [];
        let currentRowIndex = 0;
        let currentCardIndex = 0;
        let player = null;
        let isPlayerReady = false;
        let preloadTimer = null;
        let hideRowsTimer = null;
        let hideSinopsisTimer = null;
        let isFullscreenActive = false;
        let isPausedManually = false;
        let isVideoLoadedAndPlaying = false;
        let currentVideoId = null;

        const preloadedBackdrops = {};
        const preloadedPosters = {};

        const tag = document.createElement('script');
        tag.src = "https://www.youtube/iframe_api".startsWith("http") ? "https://www.youtube.com/iframe_api" : "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            fetchSubredditWallpapers();
        }

        function setLoaderStatusText(text) {
            const el = document.getElementById('loader-status');
            if (el) el.innerText = text;
        }

        function preloadRowFirstItems() {
            categories.forEach((cat, rIdx) => {
                if (cat && cat.items && cat.items.length > 0) {
                    const firstItem = cat.items[0];
                    if (firstItem.backdrop_url) {
                        const bg = new Image();
                        bg.src = firstItem.backdrop_url;
                        preloadedBackdrops[rIdx] = bg;
                    }
                    if (firstItem.poster_url) {
                        const poster = new Image();
                        poster.src = firstItem.poster_url;
                        preloadedPosters[rIdx] = poster;
                    }
                }
            });
        }

        async function fetchSubredditWallpapers() {
            setLoaderStatusText("Cargando recomendaciones para vos...");
            categories = [];

            try {
                const cacheUrl = `https://raw.githubusercontent.com/todout/fondos-projectivy/master/trailers_cache.json?t=${Date.now()}`;
                const remoteRes = await fetch(cacheUrl);
                if (remoteRes.ok) {
                    const data = await remoteRes.json();
                    if (data && data.rows) {
                        categories = data.rows;
                    } else if (Array.isArray(data)) {
                        categories = [{ category: "Recomendaciones para vos", items: data }];
                    }
                }
            } catch (e) {
                console.warn("Error cargando desde GitHub Raw:", e);
            }

            if (categories.length === 0) {
                try {
                    const localRes = await fetch('./trailers.json');
                    if (localRes.ok) {
                        const localData = await localRes.json();
                        if (localData && localData.rows) {
                            categories = localData.rows;
                        } else if (Array.isArray(localData)) {
                            categories = [{ category: "Recomendaciones para vos", items: localData }];
                        }
                    }
                } catch (e) {}
            }

            if (categories.length === 0) {
                setLoaderStatusText("No se pudo cargar el catálogo.");
                return;
            }

            // Precargar fotos, sinopsis y datos del 1er item de cada fila inmediatamente al iniciar
            preloadRowFirstItems();

            // Mensajes dinámicos durante la construcción
            const loadingSteps = [
                "Cargando Top 10 NETFLIX...",
                "Cargando Top 10 Disney+...",
                "Cargando Top 10 Prime Video...",
                "Cargando Top 10 Apple TV+...",
                "Cargando Top 10 Max..."
            ];
            let stepIdx = 0;
            const msgInterval = setInterval(() => {
                if (stepIdx < loadingSteps.length) {
                    setLoaderStatusText(loadingSteps[stepIdx]);
                    stepIdx++;
                } else {
                    clearInterval(msgInterval);
                }
            }, 300);

            renderNetflixRows();

            if (!player) {
                initPlayer();
            } else {
                updateSelection(0, 0, true);
                clearInterval(msgInterval);
                dismissLoader();
            }
        }

        function dismissLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 400);
            }
        }

        function renderNetflixRows() {
            const wrapper = document.getElementById('rows-wrapper');
            wrapper.innerHTML = '';

            categories.forEach((cat, rIdx) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'netflix-row';
                rowDiv.id = `row-${rIdx}`;

                const cardsHtml = cat.items.map((item, cIdx) => {
                    const posterSrc = item.poster_url || item.backdrop_url || '';
                    const bgImg = posterSrc ? `<img src="${posterSrc}" alt="${item.title}" onerror="this.style.display='none'">` : '';
                    return `
                        <div class="netflix-card ${rIdx === 0 && cIdx === 0 ? 'active' : ''}" id="card-${rIdx}-${cIdx}" onclick="onCardClicked(${rIdx}, ${cIdx})">
                            ${bgImg}
                            <div class="card-label">${item.title}</div>
                        </div>
                    `;
                }).join('');

                rowDiv.innerHTML = `
                    <div class="row-header">
                        <div class="row-title">${cat.category}</div>
                    </div>
                    <div class="row-cards" id="cards-track-${rIdx}">
                        ${cardsHtml}
                    </div>
                `;

                wrapper.appendChild(rowDiv);
            });
        }

        function updateSelection(rIdx, cIdx, forcePlay = false) {
            if (rIdx < 0) rIdx = 0;
            if (rIdx >= categories.length) rIdx = categories.length - 1;

            const targetRow = categories[rIdx];
            if (!targetRow || !targetRow.items || targetRow.items.length === 0) return;

            if (cIdx < 0) cIdx = 0;
            if (cIdx >= targetRow.items.length) cIdx = targetRow.items.length - 1;

            const prevCard = document.getElementById(`card-${currentRowIndex}-${currentCardIndex}`);
            if (prevCard) prevCard.classList.remove('active');

            currentRowIndex = rIdx;
            currentCardIndex = cIdx;

            const item = targetRow.items[currentCardIndex];
            const cardsTrack = document.getElementById(`cards-track-${rIdx}`);
            const activeCard = document.getElementById(`card-${currentRowIndex}-${currentCardIndex}`);
            if (activeCard) {
                activeCard.classList.add('active');
                if (cardsTrack) {
                    const cardLeft = activeCard.offsetLeft;
                    const cardWidth = activeCard.offsetWidth;
                    const trackWidth = cardsTrack.offsetWidth;
                    const targetScroll = cardLeft - (trackWidth / 2) + (cardWidth / 2);
                    cardsTrack.scrollTo({ left: Math.max(0, targetScroll), behavior: 'smooth' });
                }
            }

            // Cálculo exacto de desplazamiento vertical para ubicar CADA fila activa en la MISMA posición exacta
            const wrapper = document.getElementById('rows-wrapper');
            const targetRowDiv = document.getElementById(`row-${currentRowIndex}`);
            if (targetRowDiv && wrapper) {
                const targetY = Math.max(0, targetRowDiv.offsetTop - 8);
                wrapper.style.transform = `translateY(-${targetY}px)`;
            }

            // Control de opacidad para que las filas superiores desaparezcan limpiamente
            categories.forEach((_, idx) => {
                const rowDiv = document.getElementById(`row-${idx}`);
                if (!rowDiv) return;
                if (idx < currentRowIndex) {
                    rowDiv.style.opacity = '0';
                    rowDiv.style.pointerEvents = 'none';
                } else if (idx === currentRowIndex) {
                    rowDiv.style.opacity = '1';
                    rowDiv.style.pointerEvents = 'auto';
                } else if (idx === currentRowIndex + 1) {
                    rowDiv.style.opacity = '0.85';
                    rowDiv.style.pointerEvents = 'auto';
                } else {
                    rowDiv.style.opacity = '0';
                    rowDiv.style.pointerEvents = 'none';
                }
            });

            // Actualizar OSD Sinopsis inmediatamente desde memoria (sin lag)
            document.getElementById('movie-title').innerText = item.title;
            document.getElementById('movie-subtitle').innerText = item.subtitle || 'PELÍCULA';
            document.getElementById('movie-overview').innerText = item.overview && item.overview.trim() ? item.overview : '';

            // Mostrar foto HD inmediatamente durante navegación rápida (gracias a precarga)
            const heroImg = document.getElementById('hero-bg-img');
            const heroSrc = item.backdrop_url || item.poster_url || '';
            if (heroSrc) {
                heroImg.src = heroSrc;
                if (!isPausedManually && !isVideoLoadedAndPlaying) {
                    heroImg.classList.remove('hidden-hero');
                }
            }

            // Pausar inmediatamente el video anterior al cambiar de tarjeta para cortar el audio del ítem previo
            if (player && isPlayerReady) {
                player.pauseVideo();
            }

            isVideoLoadedAndPlaying = false;
            wakeUI();

            // Esperar 3 segundos (3000ms) antes de iniciar el trailer automáticamente al navegar, o 0ms si el usuario presiona OK
            clearTimeout(preloadTimer);
            const delay = forcePlay ? 0 : 3000;
            preloadTimer = setTimeout(() => {
                startPreloadingVideo(item.youtube_id);
            }, delay);
        }

        function startPreloadingVideo(videoId) {
            if (player && isPlayerReady && videoId) {
                if (currentVideoId !== videoId) {
                    currentVideoId = videoId;
                    player.loadVideoById({ videoId: videoId, startSeconds: 0 });
                } else {
                    player.playVideo();
                }
            }
        }

        function onCardClicked(rIdx, cIdx) {
            isPausedManually = false;
            updateSelection(rIdx, cIdx, true);
        }

        function wakeUI(keepPaused = false) {
            isFullscreenActive = false;
            clearTimeout(hideRowsTimer);
            clearTimeout(hideSinopsisTimer);

            if (isPausedManually || isVideoLoadedAndPlaying) {
                document.getElementById('hero-bg-img').classList.add('hidden-hero');
            } else {
                document.getElementById('hero-bg-img').classList.remove('hidden-hero');
            }

            document.getElementById('hero-vignette').classList.remove('fullscreen-active');
            document.getElementById('osd-left').classList.remove('fullscreen-active');
            document.getElementById('netflix-rows').classList.remove('fullscreen-active');

            if (!keepPaused && !isPausedManually) {
                resetStaggeredFullscreenTimers();
            }
        }

        function resetStaggeredFullscreenTimers() {
            clearTimeout(hideRowsTimer);
            clearTimeout(hideSinopsisTimer);

            if (isPausedManually) return;

            hideRowsTimer = setTimeout(() => {
                if (!isPausedManually) {
                    document.getElementById('netflix-rows').classList.add('fullscreen-active');
                }
            }, 3500);

            hideSinopsisTimer = setTimeout(() => {
                if (!isPausedManually) {
                    document.getElementById('hero-bg-img').classList.add('hidden-hero');
                    document.getElementById('osd-left').classList.add('fullscreen-active');
                    document.getElementById('hero-vignette').classList.add('fullscreen-active');
                    isFullscreenActive = true;
                }
            }, 5500);
        }

        function initPlayer() {
            const firstItem = categories[0]?.items[0] || { youtube_id: '0I7Q1WtTf_c' };
            currentVideoId = firstItem.youtube_id || '0I7Q1WtTf_c';
            const appOrigin = window.location.origin && window.location.origin !== 'null' && window.location.origin !== 'file://' ? window.location.origin : 'https://www.youtube-nocookie.com';

            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: currentVideoId,
                host: 'https://www.youtube-nocookie.com',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'iv_load_policy': 3,
                    'enablejsapi': 1,
                    'playsinline': 1,
                    'origin': appOrigin,
                    'widget_referrer': appOrigin
                },
                events: {
                    'onReady': () => {
                        isPlayerReady = true;
                        updateSelection(0, 0, true);
                        dismissLoader();
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            isVideoLoadedAndPlaying = true;
                            document.getElementById('hero-bg-img').classList.add('hidden-hero');
                        } else if (e.data === YT.PlayerState.ENDED) {
                            isPausedManually = false;
                            updateSelection(currentRowIndex, currentCardIndex + 1, true);
                        }
                    },
                    'onError': (e) => {
                        console.warn("YT Error:", e.data);
                        const item = categories[currentRowIndex]?.items[currentCardIndex];
                        if (item && isPlayerReady) {
                            player.loadPlaylist({
                                list: item.title + ' trailer oficial espanol latino',
                                listType: 'search'
                            });
                        }
                    }
                }
            });
        }

        function seekBy(seconds) {
            if (!player || !isPlayerReady) return;
            const curr = player.getCurrentTime();
            player.seekTo(curr + seconds, true);
            wakeUI(isPausedManually);
        }

        function togglePlayPause() {
            if (!player || !isPlayerReady) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                isPausedManually = true;
                clearTimeout(preloadTimer);
                clearTimeout(hideRowsTimer);
                clearTimeout(hideSinopsisTimer);
                player.pauseVideo();
                wakeUI(true);
            } else {
                isPausedManually = false;
                player.playVideo();
                wakeUI(false);
            }
        }

        // Control Remoto D-Pad & Teclas Multimedia
        document.addEventListener('keydown', (e) => {
            if (isFullscreenActive) {
                isPausedManually = false;
                wakeUI();
                return;
            }

            switch(e.keyCode) {
                case 38: // Arriba - Ir a la 1ra tarjeta de la fila superior
                case 19:
                    isPausedManually = false;
                    updateSelection(currentRowIndex - 1, 0);
                    break;
                case 40: // Abajo - Ir a la 1ra tarjeta de la fila inferior
                case 20:
                    isPausedManually = false;
                    updateSelection(currentRowIndex + 1, 0);
                    break;
                case 37: // Izquierda - Moverse horizontalmente
                case 21:
                    isPausedManually = false;
                    updateSelection(currentRowIndex, currentCardIndex - 1);
                    break;
                case 39: // Derecha - Moverse horizontalmente
                case 22:
                    isPausedManually = false;
                    updateSelection(currentRowIndex, currentCardIndex + 1);
                    break;
                case 13: // Enter / OK / Select
                case 23:
                case 32:
                    isPausedManually = false;
                    if (!isVideoLoadedAndPlaying) {
                        updateSelection(currentRowIndex, currentCardIndex, true);
                    } else {
                        togglePlayPause();
                    }
                    break;
                case 85: // Play/Pause Media Button
                case 179:
                    togglePlayPause();
                    break;
                case 228: // Fast Forward
                    seekBy(10);
                    break;
                case 227: // Rewind
                    seekBy(-10);
                    break;
                case 27: // ESC / BACK
                case 4:
                    if (isPausedManually) {
                        isPausedManually = false;
                        player.playVideo();
                    }
                    document.getElementById('netflix-rows').classList.add('fullscreen-active');
                    document.getElementById('hero-bg-img').classList.add('hidden-hero');
                    document.getElementById('osd-left').classList.add('fullscreen-active');
                    document.getElementById('hero-vignette').classList.add('fullscreen-active');
                    isFullscreenActive = true;
                    break;
                default:
                    if (!isPausedManually) wakeUI();
                    break;
            }
        });
    </script>
</body>
</html>
